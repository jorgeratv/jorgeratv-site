name: Atualizar status da live

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-live-status:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Consultar YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |

          CHANNEL_ID="UCAQB_-ospgUM8ZqpvXIz0Nw"

          RESPONSE=$(curl -s \
            "https://www.googleapis.com/youtube/v3/search?part=snippet&channelId=${CHANNEL_ID}&eventType=live&type=video&key=${YOUTUBE_API_KEY}")

          echo "$RESPONSE" > youtube-response.json

          VIDEO_ID=$(python3 - <<'PY'
          import json

          try:
              with open("youtube-response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              items = data.get("items", [])

              if items:
                  print(items[0]["id"]["videoId"])

          except Exception:
              pass
          PY
          )

          if [ -n "$VIDEO_ID" ]; then

            TITLE=$(python3 - <<'PY'
          import json

          try:
              with open("youtube-response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              items = data.get("items", [])

              if items:
                  print(items[0]["snippet"]["title"])

          except Exception:
              pass
          PY
          )

            cat > public/live.json <<EOF
          {
            "live": true,
            "title": $(python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))' <<< "$TITLE"),
            "url": "https://www.youtube.com/watch?v=${VIDEO_ID}"
          }
          EOF

          else

            cat > public/live.json <<EOF
          {
            "live": false,
            "title": "JorgeraTV",
            "message": "Nenhuma transmissão ao vivo no momento.",
            "url": "https://www.youtube.com/@JorgeraTV"
          }
          EOF

          fi

      - name: Verificar alterações
        id: changes
        run: |

          git diff --quiet public/live.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Salvar live.json
        if: steps.changes.outputs.changed == 'true'
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/live.json

          git commit -m "Atualiza status da live"

          git push
